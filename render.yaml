services:
  - type: web
    name: vs-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BROWSER_PASSWORD
        value: "1"
      - key: WEB_USER
        value: vs
      - key: WEB_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
